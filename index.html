<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0B0D;
    --surface: #16161A;
    --surface-2: #1D1D22;
    --gold: #B08D57;
    --gold-light: #D4B483;
    --white: #F5F3EE;
    --muted: #8B8B90;
    --line: rgba(245,243,238,0.09);
    --new: #6FCF97;
    --missed: #C2634B;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  ::selection { background: var(--gold); color: var(--bg); }

  .container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  h1, h2, h3 { font-family: 'Manrope', sans-serif; letter-spacing: -0.02em; }

  a { color: inherit; text-decoration: none; }

  /* ---------- Nav ---------- */
  nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(11,11,13,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand-mark {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-mark svg { width: 100%; height: 100%; }
  .brand-name { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; }
  .nav-cta {
    font-size: 13px; font-weight: 600;
    padding: 9px 18px; border-radius: 8px;
    border: 1px solid var(--gold);
    color: var(--gold-light);
  }

  /* ---------- Buttons ---------- */
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 34px; }
  .btn-primary {
    background: var(--gold); color: var(--bg);
    font-weight: 700; font-size: 14px;
    padding: 14px 24px; border-radius: 9px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-secondary {
    border: 1px solid var(--line); color: var(--white);
    font-weight: 600; font-size: 14px;
    padding: 14px 24px; border-radius: 9px;
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(245,243,238,0.03);
  }

  /* ---------- Section scaffolding ---------- */
  .section { padding: 96px 0; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gold-light);
    margin-bottom: 16px;
  }
  .reveal { opacity: 0; transform: translateY(16px); transition: opacity 0.6s ease, transform 0.6s ease; }
  .reveal.in { opacity: 1; transform: translateY(0); }

  /* ---------- Hero ---------- */
  .hero { padding: 88px 0 100px; position: relative; }
  .hero::before {
    content: ""; position: absolute; top: -120px; left: 50%; transform: translateX(-50%);
    width: 900px; height: 500px;
    background: radial-gradient(ellipse, rgba(176,141,87,0.14), transparent 65%);
    pointer-events: none;
  }
  .hero-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 56px; align-items: center; position: relative; }
  .hero h1 {
    font-size: clamp(34px, 4.6vw, 52px);
    line-height: 1.08; font-weight: 800;
    margin-bottom: 20px;
  }
  .hero h1 .accent { color: var(--gold-light); }
  .hero .sub { font-size: 16.5px; line-height: 1.65; color: var(--muted); max-width: 46ch; }

  /* ---------- Dashboard mock (signature element, reused 3x) ---------- */
  .browser-chrome {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    padding: 11px 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .chrome-dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(245,243,238,0.15); }
  .chrome-url {
    margin-left: 10px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted);
    background: rgba(245,243,238,0.04);
    padding: 4px 12px; border-radius: 6px;
    flex: 1;
  }
  .dash {
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: none;
    border-radius: 0 0 16px 16px;
    padding: 18px;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6);
  }
  .dash.standalone { border-top: 1px solid var(--line); border-radius: 16px; }
  .dash-head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line);
  }
  .dash-head .title { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
  .live-pill {
    display: flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--new);
    background: rgba(111,207,151,0.08); border: 1px solid rgba(111,207,151,0.25);
    padding: 4px 9px; border-radius: 20px;
  }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--new); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(111,207,151,0.5); } 70% { box-shadow: 0 0 0 6px rgba(111,207,151,0); } }

  .lead-card {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    opacity: 0; transform: translateY(10px) scale(0.98);
  }
  .lead-card.pop { animation: pop-in 0.55s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes pop-in {
    0% { opacity: 0; transform: translateY(10px) scale(0.98); box-shadow: 0 0 0 0 rgba(176,141,87,0); }
    55% { opacity: 1; transform: translateY(0) scale(1.01); box-shadow: 0 0 0 6px rgba(176,141,87,0.12); }
    100% { opacity: 1; transform: translateY(0) scale(1); box-shadow: 0 0 0 0 rgba(176,141,87,0); }
  }
  .lead-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .lead-name { font-size: 13.5px; font-weight: 600; }
  .status-badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 3px 8px; border-radius: 20px;
  }
  .status-new { color: var(--new); background: rgba(111,207,151,0.1); }
  .lead-meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .lead-meta .mono { color: var(--gold-light); }

  .dash-ghost { opacity: 0.35; }

  /* ---------- Problem section ---------- */
  .problem-msg {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px;
    max-width: 420px;
    margin: 0 auto 48px;
  }
  .problem-msg .time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--gold-light); margin-bottom: 8px; }
  .problem-msg .msg { font-size: 15.5px; color: var(--white); }

  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .compare-col {
    border-radius: 14px; padding: 22px;
    border: 1px solid var(--line);
  }
  .compare-col.bad { background: rgba(194,99,75,0.05); }
  .compare-col.good { background: rgba(176,141,87,0.05); }
  .compare-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 16px;
  }
  .compare-label.bad-label { color: var(--missed); }
  .compare-label.good-label { color: var(--gold-light); }
  .flow-step { display: flex; align-items: center; gap: 10px; font-size: 13.5px; padding: 9px 0; color: var(--muted); }
  .flow-step .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .bad .flow-step .dot { background: var(--missed); }
  .good .flow-step .dot { background: var(--gold); }
  .flow-step.final { color: var(--white); font-weight: 600; }
  .flow-arrow { color: var(--muted); font-size: 11px; padding-left: 3px; }

  /* ---------- Product section ---------- */
  .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
  .chat-mock {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
  }
  .chat-bubble { max-width: 84%; padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; margin-bottom: 9px; }
  .chat-in { background: var(--surface-2); color: var(--white); border-bottom-left-radius: 3px; }
  .chat-out { background: var(--gold); color: var(--bg); font-weight: 500; margin-left: auto; border-bottom-right-radius: 3px; }

  /* ---------- 4-step system ---------- */
  .steps-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 20px; }
  .steps-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .step-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px 20px;
  }
  .step-num { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--gold-light); margin-bottom: 14px; }
  .step-card h3 { font-size: 16.5px; font-weight: 700; margin-bottom: 8px; }
  .step-card p { font-size: 13px; color: var(--muted); line-height: 1.55; }

  /* ---------- Proof section ---------- */
  .proof-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 36px 40px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 28px;
    align-items: center;
  }
  .proof-badge {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(176,141,87,0.1);
    border: 1px solid rgba(176,141,87,0.3);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 20px; color: var(--gold-light);
  }
  .proof-status {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--new);
    margin-bottom: 10px;
  }
  .proof-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .proof-card p { font-size: 13.5px; color: var(--muted); line-height: 1.6; }

  /* ---------- FAQ section ---------- */
  .faq-item {
    border-bottom: 1px solid var(--line);
    padding: 22px 0;
  }
  .faq-q {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; font-size: 15.5px; font-weight: 600;
  }
  .faq-icon {
    font-family: 'IBM Plex Mono', monospace; color: var(--gold-light); font-size: 16px;
    transition: transform 0.25s ease;
    flex-shrink: 0; margin-left: 20px;
  }
  .faq-item.open .faq-icon { transform: rotate(45deg); }
  .faq-a {
    max-height: 0; overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.3s ease, margin-top 0.3s ease;
    opacity: 0;
    font-size: 14px; color: var(--muted); line-height: 1.65;
  }
  .faq-item.open .faq-a { max-height: 200px; opacity: 1; margin-top: 12px; }

  /* ---------- Try It Live ---------- */
  .try-live {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    max-width: 460px;
    margin: 34px auto 0;
  }
  .try-live-messages {
    padding: 18px 16px;
    min-height: 220px;
    display: flex; flex-direction: column; gap: 9px;
    justify-content: flex-end;
  }
  .try-bubble { max-width: 84%; padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; opacity: 0; transform: translateY(6px); animation: rise-in 0.4s ease forwards; }
  @keyframes rise-in { to { opacity: 1; transform: translateY(0); } }
  .try-in { background: var(--surface-2); color: var(--white); border-bottom-left-radius: 3px; }
  .try-out { background: var(--gold); color: var(--bg); font-weight: 500; margin-left: auto; border-bottom-right-radius: 3px; }
  .try-live-options {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 14px 16px 18px;
    border-top: 1px solid var(--line);
  }
  .try-live-btn {
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
    border: 1px solid var(--gold); color: var(--gold-light);
    background: rgba(176,141,87,0.06);
    padding: 8px 14px; border-radius: 20px;
    cursor: pointer;
  }
  .try-live-btn:hover { background: rgba(176,141,87,0.14); }
  .try-live-btn:disabled { opacity: 0.35; cursor: default; }

  /* ---------- Trust section ---------- */
  .trust {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 52px 44px;
    text-align: center;
  }
  .trust h2 { font-size: 27px; margin-bottom: 24px; }
  .trust-split { display: grid; grid-template-columns: 1fr auto 1fr; gap: 28px; align-items: center; max-width: 640px; margin: 0 auto; }
  .trust-col { text-align: left; }
  .trust-col .label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold-light); margin-bottom: 8px; }
  .trust-col p { font-size: 14px; color: var(--muted); line-height: 1.6; }
  .trust-divider { width: 1px; height: 50px; background: var(--line); }

  /* ---------- Demo section ---------- */
  .demo-wrap { text-align: center; }
  .video-frame {
    margin-top: 30px;
    border-radius: 16px; overflow: hidden;
    border: 1px solid var(--line);
    aspect-ratio: 16/9;
    max-width: 720px; margin-left: auto; margin-right: auto;
  }
  .video-frame iframe { width: 100%; height: 100%; border: 0; }

  /* ---------- Final CTA ---------- */
  .final-cta { text-align: center; padding: 100px 0 110px; }
  .final-cta h2 { font-size: clamp(28px, 4vw, 40px); margin-bottom: 14px; }
  .final-cta p { color: var(--muted); font-size: 15px; margin-bottom: 8px; }
  .final-cta .btn-row { justify-content: center; }

  footer {
    border-top: 1px solid var(--line);
    padding: 32px 0;
    text-align: center;
  }
  footer .tagline { font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 13px; color: var(--gold-light); margin-bottom: 6px; }
  footer p { font-size: 11.5px; color: var(--muted); }

  h2.section-title { font-size: clamp(24px, 3.2vw, 32px); font-weight: 800; line-height: 1.2; margin-bottom: 14px; }
  p.section-sub { color: var(--muted); font-size: 15px; max-width: 52ch; }

  @media (max-width: 860px) {
    .hero-grid { grid-template-columns: 1fr; }
    .product-grid { grid-template-columns: 1fr; }
    .compare-grid { grid-template-columns: 1fr; }
    .steps-grid { grid-template-columns: 1fr 1fr; }
    .steps-grid.cols-3 { grid-template-columns: 1fr 1fr; }
    .trust-split { grid-template-columns: 1fr; }
    .trust-divider { display: none; }
  }
  @media (max-width: 520px) {
    .steps-grid { grid-template-columns: 1fr; }
    .steps-grid.cols-3 { grid-template-columns: 1fr; }
    .section { padding: 64px 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
    .lead-card { opacity: 1 !important; transform: none !important; animation: none !important; }
    .live-dot { animation: none; }
  }
</style>
</head>
